name: windows-vst3

# Builds Umbral.vst3 with Visual Studio on Windows and publishes it as a ready-to-use zip.
#   * every run publishes a GitHub Release (tag windows-build-<n>) with the zip attached: just download Umbral.vst3 from Releases
on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: cmake -S . -B build -A x64 -DUMBRAL_BUILD_TESTS=OFF
      - name: Build
        run: cmake --build build --config Release --target Umbral_VST3 --parallel
      - name: Package
        shell: pwsh
        run: |
          $b = "build/Umbral_artefacts/Release/VST3/Umbral.vst3"
          if (-not (Test-Path $b)) { throw "missing $b" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path $b -DestinationPath dist/Umbral-windows-x64-vst3.zip -Force
          Get-ChildItem -Recurse $b | Select-Object FullName, Length
      - uses: actions/upload-artifact@v4
        with:
          name: Umbral-windows-x64-vst3
          path: dist/Umbral-windows-x64-vst3.zip
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-build-${{ github.run_number }}
          name: Umbral VST3 for Windows (build ${{ github.run_number }})
          body: "Unzip and copy the Umbral.vst3 folder to C:\\Program Files\\Common Files\\VST3, then rescan VST3 in your DAW. Built with Visual Studio from ${{ github.sha }}. Not yet tested in a DAW."
          files: dist/Umbral-windows-x64-vst3.zip
